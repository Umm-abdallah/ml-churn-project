# Pipeline Logstash : fichier de logs JSON de l'API -> Elasticsearch
input {
  file {
    path => "/logs/api.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-ml-churn"
    codec => "json"
  }
}

filter {
  # Types numériques explicites pour les visualisations Kibana
  if [probability] {
    mutate { convert => { "probability" => "float" } }
  }
  if [response_time_ms] {
    mutate { convert => { "response_time_ms" => "float" } }
  }
  # Étiquette pratique pour filtrer les erreurs
  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ml-churn-logs-%{+YYYY.MM.dd}"
  }
}
