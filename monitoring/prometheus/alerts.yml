groups:
  - name: ml-churn-api
    rules:
      - alert: ApiDown
        expr: up{job="ml-churn-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "L'API de prédiction ne répond plus"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="ml-churn-api", status="5xx"}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="ml-churn-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Plus de 5 % de réponses 5xx sur 5 minutes"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="ml-churn-api", handler="/predict"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 de /predict au dessus de 500 ms"

      - alert: PredictionDrift
        # Part de CHURN prédite très éloignée du taux observé à l'entraînement (~43 %)
        expr: |
          sum(rate(churn_predictions_total{result="CHURN"}[1h]))
            / clamp_min(sum(rate(churn_predictions_total[1h])), 1e-9) > 0.8
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Taux de CHURN prédit anormal : dérive possible des données ou du modèle"
