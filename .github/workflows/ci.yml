# Corrections par rapport à l'énoncé :
# * même version de Python que l'image Docker (3.12) ;
# * le dataset et le modèle sont régénérés dans la CI avant les tests ;
# * les tests E2E Selenium tournent dans un job séparé (Chrome est fourni par le
#   runner ubuntu-latest) au lieu de casser le job de tests unitaires ;
# * ajout du job "Build Docker" annoncé dans le pipeline industriel (partie 24),
#   avec un test de fumée du conteneur ;
# * publication de l'image sur GitHub Container Registry pour la branche main.

name: CI ML Churn

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:

  test:
    name: Tests unitaires et API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Génération des données et entraînement
        run: |
          python src/generate_data.py
          python src/train.py

      - name: Tests
        run: pytest -v

      - name: Archiver le modèle et ses métriques
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: models/

  e2e:
    name: Tests E2E Selenium
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: |
          python src/generate_data.py
          python src/train.py
      - name: Selenium (Chrome headless)
        run: pytest -m e2e -v

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t ml-churn-api:${{ github.sha }} .

      - name: Test de fumée du conteneur
        run: |
          docker run -d --name smoke -p 8000:8000 ml-churn-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -fs -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":35,"anciennete":5,"revenu":450000,"nb_reclamations":2,"montant_mensuel":25000,"retards_paiement":2}'
          docker logs smoke
          docker rm -f smoke

      - name: Publication sur GHCR (branche main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ml-churn-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag ml-churn-api:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
