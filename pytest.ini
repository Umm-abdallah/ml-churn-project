[pytest]
# Correction : sans pythonpath, "from api.main import app" échoue (ModuleNotFoundError)
# car pytest ajoute le dossier tests/ au sys.path, pas la racine du projet.
pythonpath = .
testpaths = tests
# Les tests E2E Selenium demandent un navigateur : exclus par défaut, lancés avec  pytest -m e2e
addopts = -m "not e2e"
markers =
    e2e: tests de bout en bout avec Selenium (navigateur Chrome requis)
filterwarnings =
    error::UserWarning:sklearn
