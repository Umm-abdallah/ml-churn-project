global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml          # chemin relatif au fichier prometheus.yml

scrape_configs:
  # "api" est le nom du service dans docker-compose.yml (résolution DNS interne).
  # Si Prometheus tourne hors de Docker, remplacer par localhost:8000.
  - job_name: "ml-churn-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8000"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
